<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDU Flygledning</title>
<meta name="description" content="Flygledning för Minecraft-servern EDU: begär tillstånd att landa och lyfta, och styr trafiken som ATC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@500;700;900&family=Sofia+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --apron:#cfd2cb;
  --apron-2:#bfc3bb;
  --ink:#1d2229;
  --ink-2:#4b535e;
  --paper:#f7f5ee;
  --paper-2:#ecE9df;
  --yellow:#f0b90b;
  --green:#1f9d6b;
  --red:#d6403a;
  --blue:#2f6db5;
  --grey:#8a9099;
  --display:"Sofia Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--apron);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:.005em}
h2{font-size:1.65rem;font-weight:900}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Top bar */
.bar{background:var(--ink);color:var(--paper);border-bottom:6px solid var(--yellow)}
.bar-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:900;font-size:1.6rem;letter-spacing:.01em}
.brand small{display:block;color:#aeb6c2;font-size:.85rem;margin-top:-2px}
.who{display:flex;align-items:center;gap:10px;font-weight:500}
.who .role{background:var(--yellow);color:var(--ink);font-family:var(--display);font-weight:700;padding:1px 9px;border-radius:3px}
.offline{background:var(--red);color:#fff;padding:2px 9px;border-radius:3px;font-weight:700;font-size:.9rem}

main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
section.block{margin-top:30px}
section.block>header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
section.block>header p{color:var(--ink-2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:4px;font-weight:700;cursor:pointer;min-height:42px}
.btn:hover:not(:disabled){background:#000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover:not(:disabled){background:var(--apron-2)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.go:hover:not(:disabled){background:#17805a}
.btn.stop{background:var(--red);border-color:var(--red);color:#fff}
.btn.stop:hover:not(:disabled){background:#b6322d}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.92rem}

/* Panels and forms */
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:20px}
.panel.hl{box-shadow:0 0 0 4px var(--yellow)}
.panel h2{margin-bottom:4px}
.panel .lead{color:var(--ink-2);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:700;margin-bottom:4px}
.field{margin-bottom:14px}
.field small{display:block;color:var(--ink-2);margin-top:3px}
input[type=text],input[type=password],select,textarea{width:100%;background:#fff;border:2px solid var(--ink);border-radius:4px;padding:9px 11px;min-height:44px}
textarea{min-height:92px;resize:vertical;line-height:1.4}
input::placeholder{color:#8b929c}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Auth */
.auth{max-width:460px;margin:28px auto 0}
.tabs{display:flex;border:2px solid var(--ink);border-radius:6px 6px 0 0;overflow:hidden;background:var(--ink)}
.tabs button{flex:1;border:0;background:transparent;color:#c5ccd6;padding:12px;font-family:var(--display);font-weight:700;font-size:1.2rem;cursor:pointer}
.tabs button.on{background:var(--paper);color:var(--ink)}
.auth .panel{border-radius:0 0 6px 6px;border-top:0}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-opt{position:relative}
.role-opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.role-opt span{display:block;border:2px solid var(--ink);border-radius:4px;padding:10px 12px;background:#fff}
.role-opt span b{display:block;font-family:var(--display);font-size:1.25rem}
.role-opt span small{color:var(--ink-2)}
.role-opt input:checked+span{background:var(--yellow)}
.role-opt input:checked+span small{color:var(--ink)}
.role-opt input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.notice{background:var(--paper-2);border-left:6px solid var(--yellow);padding:10px 12px;margin-bottom:14px}
.notice.ok{border-color:var(--green)}

/* Runway designators */
.rwy-pick{display:flex;gap:8px;flex-wrap:wrap}
.rwy{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:6px 10px;background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:3px;font-family:var(--display);line-height:1;position:relative}
.rwy b{font-size:1.6rem;font-weight:900}
.rwy small{font-family:var(--body);font-size:.72rem;margin-top:3px;color:#c9d0da}
.rwy.busy{background:repeating-linear-gradient(135deg,#7d1f1b 0 7px,var(--red) 7px 14px);border-color:#7d1f1b}
.rwy.busy small{color:#fff;font-weight:700}
button.rwy{cursor:pointer}
button.rwy.sel{outline:4px solid var(--yellow);outline-offset:2px}
button.rwy:hover{filter:brightness(1.2)}

.seg{display:inline-flex;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 18px;font-weight:700;cursor:pointer;min-height:42px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}

/* Airports */
.aps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ap{background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ap header{display:flex;flex-direction:column;gap:6px}
.ap h3{font-size:1.25rem}
.ap .atc{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.92rem}
.ap .atc i{width:11px;height:11px;border-radius:50%;background:var(--grey);display:inline-block}
.ap .atc.on i{background:var(--green);box-shadow:0 0 0 3px #1f9d6b33}
.ap .atc.off{color:var(--ink-2);font-weight:500}
.ap .rwys{display:flex;gap:8px;flex-wrap:wrap}
.ap footer{color:var(--ink-2);font-size:.93rem}
.ap.mine{box-shadow:0 0 0 4px var(--yellow)}

/* Flight strips */
.strips{display:flex;flex-direction:column;gap:8px}
.strip{display:grid;grid-template-columns:70px minmax(0,1.6fr) 74px minmax(0,1.2fr) auto;align-items:stretch;background:var(--paper);border:2px solid var(--ink);border-left-width:14px;border-radius:3px}
.strip>div{padding:9px 12px;border-left:2px dashed #b3b0a3;display:flex;flex-direction:column;justify-content:center;min-width:0}
.strip>div:first-child{border-left:0}
.strip.s-inbound{border-left-color:var(--blue)}
.strip.s-pending{border-left-color:var(--yellow)}
.strip.s-approved{border-left-color:var(--green)}
.strip.s-denied{border-left-color:var(--red)}
.strip.s-completed{border-left-color:var(--blue)}
.strip.s-cancelled,.strip.s-expired{border-left-color:var(--grey)}
.strip.s-completed,.strip.s-cancelled,.strip.s-expired,.strip.s-denied{background:var(--paper-2)}
.strip .t{font-family:var(--display);font-weight:700;font-size:1.25rem}
.strip .t small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--ink-2)}
.strip .fl{font-family:var(--display);font-weight:900;font-size:1.5rem;line-height:1.05}
.strip .fl span{font-family:var(--body);font-weight:500;font-size:.95rem;color:var(--ink-2);margin-left:6px}
.strip .sub{color:var(--ink-2);font-size:.92rem;overflow-wrap:anywhere}
.strip .rw{align-items:center;text-align:center}
.strip .rw b{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1}
.strip .rw small{color:var(--ink-2);font-size:.78rem}
.status{display:inline-block;align-self:flex-start;font-weight:700;font-size:.88rem;padding:1px 9px;border-radius:3px;color:#fff}
.status.pending{background:var(--yellow);color:var(--ink)}
.status.approved{background:var(--green)}
.status.denied{background:var(--red)}
.status.completed{background:var(--blue)}
.status.cancelled,.status.expired{background:var(--grey)}
.strip .note{font-style:italic;font-size:.93rem;margin-top:4px;overflow-wrap:anywhere}
.strip .act{gap:6px;align-items:stretch;min-width:210px}
.strip .act input{min-height:36px;padding:5px 9px}
.strip .act .row{flex-wrap:nowrap}
.typ{display:inline-block;font-family:var(--display);font-weight:700;font-size:.95rem;padding:0 7px;border:2px solid var(--ink);border-radius:3px;margin-left:8px;vertical-align:2px}
@media(max-width:820px){
  .strip{grid-template-columns:62px 1fr 64px}
  .strip>div:nth-child(4){grid-column:1/-1;border-left:0;border-top:2px dashed #b3b0a3}
  .strip>.act{grid-column:1/-1;border-left:0;border-top:2px dashed #b3b0a3}
}
.empty{background:var(--paper-2);border:2px dashed var(--grey);border-radius:6px;padding:18px;color:var(--ink-2)}

/* Admin table */
.tbl{width:100%;border-collapse:collapse;background:var(--paper);border:2px solid var(--ink)}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid #c9c6ba;vertical-align:middle}
.tbl th{background:var(--ink);color:var(--paper);font-family:var(--display);font-size:1.05rem;font-weight:700}
.tbl .acts{display:flex;gap:6px;flex-wrap:wrap}
.scroll{overflow-x:auto}
.pillrole{font-family:var(--display);font-weight:700;border:2px solid var(--ink);border-radius:3px;padding:0 7px}

/* Knappar i den mörka toppraden */
.btn.onbar{color:var(--paper);border-color:var(--paper)}
.btn.onbar:hover:not(:disabled){background:#3a414c}
.btn.onbar.on,.btn.onbar.on:hover:not(:disabled){background:var(--yellow);color:var(--ink);border-color:var(--yellow)}

/* Välkomstpanel och information på startsidan */
.home h3{margin:16px 0 8px}
.ann-list{display:flex;flex-direction:column;gap:10px}
.ann{background:var(--paper-2);border-left:8px solid var(--blue);padding:10px 14px;border-radius:3px}
.ann.admin{border-left-color:var(--yellow);background:#fff3c4}
.ann .hd{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;color:var(--ink-2);font-size:.9rem;margin-bottom:4px}
.ann .hd b{color:var(--ink)}
.ann .tx{overflow-wrap:anywhere}
.ann .sa{margin-top:8px}

/* Aktivitet (admin) */
.act-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.act-grid{grid-template-columns:1fr}}
.act-col>h3{margin-bottom:8px}
.act-scroll{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;padding:2px}
.person{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:9px 12px}
.person.off{background:var(--paper-2);border-color:#9a9788}
.person .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.person .seen{margin-left:auto;color:var(--ink-2);font-size:.88rem}
.person .pd{margin-top:3px;color:var(--ink-2);overflow-wrap:anywhere}
.dot{width:11px;height:11px;border-radius:50%;background:var(--grey);display:inline-block;flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 3px #1f9d6b33}
.events{list-style:none;margin:0;padding:2px;display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.ev{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;background:var(--paper);border:1px solid #bdb9a8;border-left:6px solid var(--blue);padding:6px 10px;border-radius:3px}
.ev.atc{border-left-color:var(--yellow)}
.ev.admin{border-left-color:var(--ink)}
.ev .et{color:var(--ink-2);font-size:.85rem}
.ev .tx{overflow-wrap:anywhere}

/* Stängda flygplatser och banor, information */
.ap.closed{border-color:var(--red);background:#fbefee}
.closed-banner{background:var(--red);color:#fff;padding:7px 10px;border-radius:3px;display:flex;flex-direction:column;gap:2px;font-weight:500}
.closed-banner b{font-family:var(--display);font-size:1.2rem}
.rwy.shut{border-color:#2b2f36;background:linear-gradient(to top right,transparent calc(50% - 2px),var(--yellow) calc(50% - 2px),var(--yellow) calc(50% + 2px),transparent calc(50% + 2px)),linear-gradient(to bottom right,transparent calc(50% - 2px),var(--yellow) calc(50% - 2px),var(--yellow) calc(50% + 2px),transparent calc(50% + 2px)),#2b2f36}
.rwy.shut b,.rwy.shut small{position:relative;background:#2b2f36;padding:0 3px;color:#fff}
button.rwy:disabled{opacity:.55;cursor:not-allowed}
button.rwy.tg:hover{filter:brightness(1.25)}
.rw-reasons,.notices{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.rw-reasons li{color:var(--red);font-weight:700}
.notices li{background:#fff3c4;border-left:6px solid var(--yellow);padding:4px 9px}
.notice-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.notice-list li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff3c4;border-left:6px solid var(--yellow);padding:6px 10px}
.notice-list li span{overflow-wrap:anywhere}

/* ACARS: utskrifter som från cockpitskrivaren */
.hd-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.acars-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
@media(max-width:820px){.acars-grid{grid-template-columns:1fr}}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tpl button{border:2px solid var(--ink);background:#fff;border-radius:3px;padding:4px 10px;font-weight:500;cursor:pointer;font-size:.92rem}
.tpl button:hover{background:var(--yellow)}
.slip-list{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow:auto;padding:2px}
.slip{background:#fffef6;border:1px solid #bdb9a8;border-left:8px solid var(--blue);padding:10px 12px;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;box-shadow:0 1px 0 #0002}
.slip.atc{border-left-color:var(--yellow)}
.slip .hd{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;color:var(--ink-2);font-size:.8rem;border-bottom:1px dashed #b3b0a3;padding-bottom:5px;margin-bottom:6px}
.slip .tx{overflow-wrap:anywhere}
.slip .sa{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}

/* Toasts */
#toasts{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;border-left:8px solid var(--blue);padding:10px 14px;border-radius:3px;font-weight:500;box-shadow:0 6px 20px #0004}
.toast.ok{border-color:var(--green)}
.toast.err{border-color:var(--red)}

.splash{padding:80px 20px;text-align:center;color:var(--ink-2);font-family:var(--display);font-size:1.4rem}
@media(prefers-reduced-motion:no-preference){
  .toast{animation:tin .18s ease-out}
  @keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app"><div class="splash">Laddar…</div></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px">Den här sidan kräver JavaScript.</p></noscript>

<script>
"use strict";
/* ---------- Konstanter ---------- */
const ACTIVE = ["pending", "approved"];
const STATUS = { pending: "Väntar", approved: "Godkänd", denied: "Nekad", completed: "Genomförd", cancelled: "Avbruten", expired: "Utgången" };
const TYPE = { landing: "Landning", takeoff: "Start" };
const ROLE = { pilot: "Pilot", atc: "ATC", admin: "Admin" };
const POLL_MS = 8000;

/* ---------- Tillstånd ---------- */
const S = { token: null, me: null, data: null, users: null, activity: null, sig: "", offline: false, booting: true, knownMsgs: null, knownAnns: null };
const ui = {
  tab: "login",
  login: { username: "", password: "" },
  reg: { username: "", password: "", password2: "", role: "pilot" },
  profile: { flightNumber: "", airline: "", destination: "" },
  profileInit: false,
  pilot: { airport: "", runway: "", type: "landing" },
  atcAirport: "",
  notes: {},
  acars: { airport: "", to: "", text: "" },
  status: { reason: "", notice: "" },
  enroute: { eta: "" },
  adminAirport: "",
  ann: { audience: "", text: "" },
  activityOpen: false,
  activityFilter: "all",
  regDone: false,
};
try { S.token = localStorage.getItem("edu_token"); } catch (e) {}

const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = (t) => (t ? new Date(t).toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" }) : "");
const dayLabel = (t) => new Date(t).toLocaleDateString("sv-SE", { day: "numeric", month: "short" });
function setPath(o, path, v) {
  const p = path.split(".");
  while (p.length > 1) o = o[p.shift()] ??= {};
  o[p[0]] = v;
}

/* ---------- API ---------- */
async function api(path, { method = "GET", body } = {}) {
  let res;
  try {
    res = await fetch("/api/" + path, {
      method,
      headers: { "Content-Type": "application/json", ...(S.token ? { Authorization: "Bearer " + S.token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    const err = new Error("Ingen kontakt med servern. Kontrollera din anslutning.");
    err.network = true;
    throw err;
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || "Något gick fel (" + res.status + ").");
    err.status = res.status;
    if (res.status === 401 && S.token && path !== "login") forceLogout("Du har loggats ut. Logga in igen.");
    throw err;
  }
  return data;
}

function toast(msg, kind = "info") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 4800);
}

function forceLogout(msg) {
  S.token = null; S.me = null; S.data = null; S.users = null; S.activity = null; S.sig = ""; S.knownMsgs = null; S.knownAnns = null; ui.profileInit = false;
  ui.acars = { airport: "", to: "", text: "" };
  ui.ann = { audience: "", text: "" };
  ui.activityOpen = false;
  try { localStorage.removeItem("edu_token"); } catch (e) {}
  stopPolling();
  if (msg) toast(msg, "err");
  render();
}

/* ---------- Hämta och rita ---------- */
async function refresh(force) {
  if (!S.token) return;
  try {
    const isAdmin = !!(S.me && S.me.role === "admin");
    const [data, users, act] = await Promise.all([
      api("state"),
      isAdmin ? api("admin/users") : Promise.resolve(null),
      isAdmin && ui.activityOpen ? api("admin/activity") : Promise.resolve(null),
    ]);
    S.offline = false;
    S.me = data.me;
    S.users = users ? users.users : null;
    S.activity = act;
    if (S.me.role !== "admin") {
      const msgs = data.messages || [];
      if (S.knownMsgs) {
        for (const m of msgs) {
          if (m.from !== S.me.username && !S.knownMsgs.has(m.id))
            toast("ACARS från " + (m.fromRole === "pilot" ? m.flightNumber || m.from : "ATC " + m.from) + ": " + m.text, "info");
        }
      }
      S.knownMsgs = new Set(msgs.map((m) => m.id));

      const anns = data.announcements || [];
      if (S.knownAnns) {
        for (const n of anns) {
          if (n.from !== S.me.username && !S.knownAnns.has(n.id))
            toast("Ny information från " + (n.fromRole === "admin" ? "admin" : "ATC " + n.from) + ": " + n.text, "info");
        }
      }
      S.knownAnns = new Set(anns.map((n) => n.id));
    }
    if (!ui.profileInit) {
      ui.profile = { flightNumber: S.me.flightNumber || "", airline: S.me.airline || "", destination: S.me.destination || "" };
      ui.atcAirport = S.me.airport || "";
      ui.profileInit = true;
    }
    const sig = JSON.stringify([data, users, act, S.offline]);
    if (sig !== S.sig || force) { S.sig = sig; S.data = data; render(); }
  } catch (e) {
    if (e.network && !S.offline) { S.offline = true; S.sig = ""; render(); }
  } finally {
    S.booting = false;
  }
}

let timer = null;
function startPolling() { stopPolling(); timer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS); }
function stopPolling() { if (timer) clearInterval(timer); timer = null; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me) refresh(); });

function render() {
  const ae = document.activeElement;
  const key = ae && ae.dataset && ae.dataset.bind;
  let s = null, e = null;
  if (key && typeof ae.selectionStart === "number") { s = ae.selectionStart; e = ae.selectionEnd; }
  app.innerHTML = view();
  if (key) {
    const n = app.querySelector('[data-bind="' + key + '"]');
    if (n) { n.focus(); if (s !== null) { try { n.setSelectionRange(s, e); } catch (x) {} } }
  }
}

    (reply && m.fromRole === "pilot" ? `<button class="btn alt sm" data-action="acars-reply" data-to="${esc(m.from)}">Svara</button>` : "") +

function sinceText(ts, now) {
  const m = Math.floor((now - ts) / 60000);
  if (m < 1) return "nyss";
  if (m < 60) return "för " + m + " min sedan";
  if (m < 24 * 60) return "för " + Math.floor(m / 60) + " tim sedan";
  return dayLabel(ts) + " " + clock(ts);
}

function describePerson(p, now) {
  if (p.role === "atc") return p.airport ? (p.online ? "På tjänst vid " : "Senast på tjänst vid ") + esc(apNameOf(p.airport)) : "Inte på tjänst";
  const parts = [];
  if (p.request) parts.push(esc(TYPE[p.request.type]) + " på bana " + esc(p.request.runway) + " vid " + esc(apNameOf(p.request.airport)) + " (" + esc(STATUS[p.request.status].toLowerCase()) + ")");
  if (p.enroute) parts.push("På väg till " + esc(p.enroute.destination) + (p.enroute.eta ? ", " + esc(etaText(p.enroute.eta, now).toLowerCase()) : ""));
  if (!parts.length) parts.push(p.flightNumber ? "Flyg " + esc(p.flightNumber) + " (" + esc(p.airline) + "), inget pågår" : "Har inte registrerat något flyg");

function inboundStrip(f, { admin = false } = {}) {
  const q = f.request;
  const apName = (airportById(f.airport) || {}).name || f.destination;
  return `<article class="strip s-inbound">
    <div class="t">${f.eta ? clock(f.eta) : "–"}<small>${f.eta ? "ankomst" : "okänd tid"}</small></div>
    <div><div class="fl">${esc(f.flightNumber)}<span>${esc(f.airline)}</span></div>
      <div class="sub">${esc(f.username)}${admin ? " → " + esc(apName) : ""}</div></div>
    <div class="rw"><b>${q ? esc(q.runway) : "–"}</b><small>bana</small></div>
    <div>${q ? `<span class="status ${q.status}">${STATUS[q.status]} · ${TYPE[q.type]}</span>` : `<span class="status cancelled">Ingen förfrågan än</span>`}
      <div class="sub" style="margin-top:4px">${esc(etaText(f.eta, S.data.now))}</div></div>
    ${admin ? "" : `<div class="act"><button class="btn alt sm" data-action="acars-reply" data-to="${esc(f.username)}">Skriv ACARS</button></div>`}
  </article>`;
}

function inboundSection({ admin = false } = {}) {
  const list = S.data.inbound || [];
  return `<section class="block"><header><h2>${admin ? "Flyg på väg" : "Ankommande flyg"}</h2><p>${admin ? "Alla flyg som är anmälda på väg till en flygplats." : "Piloter som har anmält att de är på väg till din flygplats. Närmast först."}</p></header>
    ${list.length ? `<div class="strips">${list.map((f) => inboundStrip(f, { admin })).join("")}</div>` : empty(admin ? "Inga flyg är anmälda på väg just nu." : "Inga flyg är anmälda på väg hit just nu. Piloter anmäler det under Flyg på väg när de har valt din flygplats som destination.")}</section>`;
}

/* --- Flygplatsstatus (ATC på plats och admin) --- */
function statusPanel(a, { picker = false } = {}) {
  const rwBtns = a.runways.map((rw) => {
    const shut = a.runwayClosed[rw];
    return `<button type="button" class="rwy tg ${shut ? "shut" : ""}" data-action="rwy-toggle" data-ap="${esc(a.id)}" data-rw="${esc(rw)}" data-closed="${shut ? "1" : "0"}" title="${shut ? "Öppna bana " : "Stäng bana "}${esc(rw)}"><b>${esc(rw)}</b><small>${shut ? "Öppna" : "Stäng"}</small></button>`;
  }).join("");
  const notices = a.notices.length
    ? `<ul class="notice-list">${a.notices.map((n) => `<li><span>${esc(n.text)}</span><button class="btn alt sm" data-action="notice-remove" data-ap="${esc(a.id)}" data-id="${esc(n.id)}">Ta bort</button></li>`).join("")}</ul>`
    : `<p style="margin-top:14px;color:var(--ink-2)">Ingen information är utlagd just nu.</p>`;
  return `<section class="block"><header><h2>Flygplatsstatus</h2><p>${esc(a.name)}</p>
    ${picker ? `<div class="hd-actions"><label class="f" for="sap" style="position:absolute;left:-9999px">Flygplats</label><select id="sap" data-bind="adminAirport" style="min-width:260px">${S.data.airports.map((x) => `<option value="${esc(x.id)}" ${x.id === a.id ? "selected" : ""}>${esc(x.name)}${x.closed ? " (stängd)" : ""}</option>`).join("")}</select></div>` : ""}</header>
    <div class="grid2">
      <div class="panel">
        <h2>Stängning</h2>
        <p class="lead">${a.closed ? "Flygplatsen är stängd. Piloter kan inte begära tillstånd här och nya förfrågningar kan inte godkännas." : "Stäng hela flygplatsen eller enskilda banor. Piloter kan då inte begära tillstånd där."}</p>
        <div class="field"><label class="f" for="sr">Orsak (valfri)</label>
          <input id="sr" type="text" maxlength="100" placeholder="till exempel Underhåll" data-bind="status.reason" value="${esc(ui.status.reason)}">
          <small>Orsaken visas för alla och följer med när du stänger flygplatsen eller en bana.</small></div>
        <div class="row" style="margin-bottom:18px">${a.closed
          ? `<button class="btn go" data-action="ap-open" data-ap="${esc(a.id)}">Öppna flygplatsen</button>`
          : `<button class="btn stop" data-action="ap-close" data-ap="${esc(a.id)}">Stäng flygplatsen</button>`}</div>
        <span class="f" style="display:block;font-weight:700;margin-bottom:4px">Banor</span>
        <p style="color:var(--ink-2);margin-bottom:8px">Klicka på en bana för att stänga eller öppna den.</p>
        <div class="rwy-pick">${rwBtns}</div>
      </div>
      <div class="panel">
        <h2>Information</h2>
        <p class="lead">Syns för alla på flygplatsens kort.</p>
        ${`<div class="tpl">${NOTICE_TPL.map((t) => `<button type="button" data-action="notice-tpl" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>`}
        <form data-form="notice" data-ap="${esc(a.id)}">
          <div class="field"><label class="f" for="sn">Information</label>
            <input id="sn" type="text" maxlength="100" autocomplete="off" placeholder="Skriv eller välj en snabbtext" data-bind="status.notice" value="${esc(ui.status.notice)}"></div>
          <button class="btn" type="submit">Lägg ut information</button>
        </form>
        ${notices}
      </div>
    </div></section>`;
}
function adminStatus() {
  const aps = S.data.airports;
  const a = aps.find((x) => x.id === ui.adminAirport) || aps[0];
  ui.adminAirport = a.id;
  return statusPanel(a, { picker: true });
}

const adminReqActions = (r) => `<div class="row">${r.status === "approved" ? `<button class="btn sm" data-action="decide" data-act="complete" data-id="${esc(r.id)}">Banan är fri</button>` : ""}<button class="btn stop sm" data-action="admin-del-req" data-id="${esc(r.id)}">Ta bort</button></div>`;

/* --- Pilot --- */
function pilotView() {
  const me = S.me, d = S.data;
  const ready = !!(me.flightNumber && me.airline);
  const active = d.requests.find((r) => ACTIVE.includes(r.status));
  const history = d.requests.filter((r) => !ACTIVE.includes(r.status));
  const ap = d.airports.find((a) => a.id === ui.pilot.airport);
  if (ap && ap.runways.length === 1) ui.pilot.runway = ap.runways[0];
  if (ap && !ap.runways.includes(ui.pilot.runway)) ui.pilot.runway = "";
  if (ap && ap.runways.length > 1 && ap.runwayClosed[ui.pilot.runway]) ui.pilot.runway = "";
  const locked = !ready || !!active;
  const canSend = !locked && ap && !ap.closed && ui.pilot.runway && !ap.runwayClosed[ui.pilot.runway];

  let activeBlock = "";
  if (active) {
    const aap = airportById(active.airport);
    const noAtc = aap && aap.atc.length === 0;
    activeBlock = `<section class="block"><header><h2>Din förfrågan</h2>
      <p>${active.status === "pending" ? (noAtc ? "Ingen ATC är på plats just nu. Förfrågan ligger kvar i 30 minuter." : "Väntar på svar från ATC.") : "Du har tillstånd. Följ ATC:s instruktioner."}</p></header>
      <div class="strips">${strip(active, { actions: `<button class="btn alt sm" data-action="cancel" data-id="${esc(active.id)}">${active.status === "approved" ? "Avsluta tillstånd" : "Avbryt förfrågan"}</button>` })}</div></section>`;
  }

  return `${homePanel()}
  ${activeBlock}
  <section class="block"><div class="grid2">
    <div class="panel ${ready ? "" : "hl"}">
      <h2>Ditt flyg</h2>
      <p class="lead">${ready ? "Dessa uppgifter följer med dina förfrågningar." : "Fyll i flygnummer och flygbolag innan du kan begära tillstånd."}</p>
      <form data-form="profile">
        <div class="field"><label class="f" for="fn">Flygnummer</label>
          <input id="fn" type="text" maxlength="12" autocapitalize="characters" placeholder="till exempel EDU101" data-bind="profile.flightNumber" value="${esc(ui.profile.flightNumber)}" required></div>
        <div class="field"><label class="f" for="al">Flygbolag</label>
          <input id="al" type="text" maxlength="40" placeholder="till exempel EDU Airways" data-bind="profile.airline" value="${esc(ui.profile.airline)}" required></div>
        <div class="field"><label class="f" for="de">Destination (valfri)</label>
          <input id="de" type="text" maxlength="60" list="dest-list" autocomplete="off" placeholder="Välj en flygplats eller skriv egen" data-bind="profile.destination" value="${esc(ui.profile.destination)}">
          <datalist id="dest-list">${d.airports.map((a) => `<option value="${esc(a.name)}"></option>`).join("")}</datalist>
          <small>Syns för ATC på dina förfrågningar. Ändra den när du ska åt ett nytt håll och spara igen.</small></div>
        <button class="btn" type="submit">Spara flyg</button>
      </form>
    </div>
    <div class="panel">
      <h2>Begär tillstånd</h2>
      <p class="lead">${active ? "Du har redan en aktiv förfrågan." : !ready ? "Spara ditt flyg först." : "Välj flygplats, bana och vad du vill göra."}</p>
      <form data-form="request">
        <div class="field"><label class="f" for="apsel">Flygplats</label>
          <select id="apsel" data-bind="pilot.airport" ${locked ? "disabled" : ""}>
            <option value="">Välj flygplats</option>
            ${d.airports.map((a) => `<option value="${esc(a.id)}" ${a.id === ui.pilot.airport ? "selected" : ""}>${esc(a.name)}${a.closed ? " (stängd)" : ""}</option>`).join("")}
          </select>
          ${ap ? `<small>${ap.atc.length ? "ATC på plats: " + ap.atc.map(esc).join(", ") : "Ingen ATC är på plats just nu."}</small>` : ""}
          ${ap && ap.closed ? `<small style="color:var(--red);font-weight:700">Flygplatsen är stängd${ap.closedReason ? ": " + esc(ap.closedReason) : ""}. Du kan inte begära tillstånd här.</small>` : ""}
          ${ap && ap.notices.length ? `<ul class="notices" style="margin-top:8px">${ap.notices.map((n) => `<li>${esc(n.text)}</li>`).join("")}</ul>` : ""}</div>
        ${ap ? `<div class="field"><span class="f" style="display:block;font-weight:700;margin-bottom:6px">Bana</span><div class="rwy-pick">
          ${ap.runways.map((rw) => { const st = ap.runwayStatus[rw], shut = ap.runwayClosed[rw]; return `<button type="button" class="rwy ${shut ? "shut" : st ? "busy" : ""} ${ui.pilot.runway === rw ? "sel" : ""}" data-action="pick-runway" data-v="${esc(rw)}" aria-pressed="${ui.pilot.runway === rw}" title="${shut ? esc("Stängd" + (shut.reason ? ": " + shut.reason : "")) : ""}" ${locked || shut ? "disabled" : ""}><b>${esc(rw)}</b><small>${shut ? "Stängd" : st ? "Upptagen" : "Ledig"}</small></button>`; }).join("")}
        </div></div>` : ""}
        <div class="field"><span class="f" style="display:block;font-weight:700;margin-bottom:6px">Jag vill</span>
          <div class="seg"><button type="button" class="${ui.pilot.type === "landing" ? "on" : ""}" data-action="pick-type" data-v="landing" ${locked ? "disabled" : ""}>Landa</button><button type="button" class="${ui.pilot.type === "takeoff" ? "on" : ""}" data-action="pick-type" data-v="takeoff" ${locked ? "disabled" : ""}>Lyfta</button></div></div>
        <button class="btn go" type="submit" ${canSend ? "" : "disabled"}>Skicka förfrågan</button>
      </form>
    </div>
  </div></section>
  ${pilotFlight()}
  ${pilotAcars()}
  <section class="block"><header><h2>Flygplatser just nu</h2><p>Röda banor har pågående tillstånd.</p></header>${airportGrid(ui.pilot.airport)}</section>
  <section class="block"><header><h2>Dina tidigare förfrågningar</h2></header>
    ${history.length ? `<div class="strips">${history.map((r) => strip(r)).join("")}</div>` : empty("Inga tidigare förfrågningar än.")}</section>`;
}

/* --- ATC --- */
function atcView() {
  const me = S.me, d = S.data;
  const myAp = airportById(me.airport);
  const pending = d.requests.filter((r) => r.status === "pending").reverse();
  const approved = d.requests.filter((r) => r.status === "approved");
  const history = d.requests.filter((r) => !ACTIVE.includes(r.status));

  const duty = `<section class="block"><div class="panel ${myAp ? "" : "hl"}"><h2>${myAp ? "Du är på tjänst" : "Gå på tjänst"}</h2>
    <p class="lead">${myAp ? "Du ser och hanterar förfrågningar för " + esc(myAp.name) + "." : "Välj vilken flygplats du är på för att ta emot förfrågningar."}</p>
    <form data-form="duty"><div class="row">
      <div style="flex:1;min-width:240px"><label class="f" for="dsel" style="position:absolute;left:-9999px">Flygplats</label>
      <select id="dsel" data-bind="atcAirport"><option value="">Välj flygplats</option>
        ${d.airports.map((a) => `<option value="${esc(a.id)}" ${a.id === ui.atcAirport ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></div>
      <button class="btn go" type="submit" ${ui.atcAirport && ui.atcAirport !== me.airport ? "" : "disabled"}>${myAp ? "Byt flygplats" : "Gå på tjänst"}</button>
      ${myAp ? `<button class="btn alt" type="button" data-action="duty-off">Gå av tjänst</button>` : ""}
    </div></form></div></section>`;

  if (!myAp) return homePanel() + duty + `<section class="block"><header><h2>Flygplatser just nu</h2></header>${airportGrid()}</section>`;

  const pendingActions = (r) => `<input type="text" maxlength="140" placeholder="Meddelande till piloten (valfritt)" aria-label="Meddelande till piloten" data-bind="notes.${esc(r.id)}" value="${esc(ui.notes[r.id] || "")}">
    <div class="row"><button class="btn go sm" data-action="decide" data-act="approve" data-id="${esc(r.id)}">Godkänn</button><button class="btn stop sm" data-action="decide" data-act="deny" data-id="${esc(r.id)}">Neka</button></div>`;
  const approvedActions = (r) => `<div class="row"><button class="btn sm" data-action="decide" data-act="complete" data-id="${esc(r.id)}">Banan är fri</button><button class="btn stop sm" data-action="decide" data-act="deny" data-id="${esc(r.id)}">Återkalla</button></div>`;

  return `${homePanel()}
  ${duty}
  <section class="block"><header><h2>Banor vid ${esc(myAp.name)}</h2></header>
    <div class="aps">${airportCard(myAp, false)}</div></section>
  ${inboundSection()}
  ${statusPanel(myAp)}
  <section class="block"><header><h2>Väntande förfrågningar</h2><p>Äldst först.</p></header>
    ${pending.length ? `<div class="strips">${pending.map((r) => strip(r, { showPilot: true, actions: pendingActions(r) })).join("")}</div>` : empty("Inga väntande förfrågningar just nu.")}</section>
  <section class="block"><header><h2>Pågående tillstånd</h2></header>
    ${approved.length ? `<div class="strips">${approved.map((r) => strip(r, { showPilot: true, actions: approvedActions(r) })).join("")}</div>` : empty("Inga banor är upptagna.")}</section>
  ${atcAcars()}
  <section class="block"><header><h2>Historik</h2></header>
    ${history.length ? `<div class="strips">${history.slice(0, 30).map((r) => strip(r, { showPilot: true })).join("")}</div>` : empty("Ingen historik än.")}</section>
  <section class="block"><header><h2>Alla flygplatser</h2></header>${airportGrid(me.airport)}</section>`;
}

/* --- Admin --- */
function adminView() {
  const users = S.users || [];
  const pend = users.filter((u) => u.status === "pending");
  const stLabel = { pending: "Väntar", approved: "Godkänd", rejected: "Nekad" };
  const stClass = { pending: "pending", approved: "approved", rejected: "denied" };
  const detail = (u) => (u.role === "pilot" ? (u.flightNumber ? esc(u.flightNumber) + " · " + esc(u.airline) + (u.destination ? " → " + esc(u.destination) : "") : "Inget flyg registrerat") : u.airport ? esc((airportById(u.airport) || {}).name || u.airport) : "Ingen flygplats vald");
  const btn = (u, act, label, cls) => `<button class="btn ${cls} sm" data-action="user-act" data-name="${esc(u.username)}" data-act="${act}">${label}</button>`;

  const pendCards = pend.length
    ? `<div class="strips">${pend.map((u) => `<article class="strip s-pending" style="grid-template-columns:minmax(0,2fr) auto">
        <div><div class="fl">${esc(u.username)}<span>${ROLE[u.role]}</span></div><div class="sub">Skapat ${dayLabel(u.createdAt)} ${clock(u.createdAt)}</div></div>
        <div class="act"><div class="row">${btn(u, "approve", "Godkänn", "go")}${btn(u, "reject", "Neka", "stop")}</div></div></article>`).join("")}</div>`
    : empty("Inga konton väntar på godkännande.");

  const rows = users.map((u) => `<tr>
    <td><b>${esc(u.username)}</b></td><td><span class="pillrole">${ROLE[u.role]}</span></td>
    <td><span class="status ${stClass[u.status]}">${stLabel[u.status]}</span></td><td>${detail(u)}</td>
    <td><div class="acts">${u.status !== "approved" ? btn(u, "approve", "Godkänn", "go") : btn(u, "reject", "Spärra", "alt")}
      ${btn(u, "password", "Nytt lösenord", "alt")}${btn(u, "delete", "Ta bort", "stop")}</div></td></tr>`).join("");

  return `${ui.activityOpen ? activityPanel() : ""}
  ${homePanel()}
  <section class="block"><header><h2>Konton som väntar</h2><p>${pend.length} ${pend.length === 1 ? "konto" : "konton"}</p></header>${pendCards}</section>
  <section class="block"><header><h2>Alla konton</h2></header>
    ${users.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Användare</th><th>Typ</th><th>Status</th><th>Uppgifter</th><th>Åtgärder</th></tr></thead><tbody>${rows}</tbody></table></div>` : empty("Det finns inga konton än.")}</section>
  ${adminStatus()}
  ${inboundSection({ admin: true })}
  <section class="block"><header><h2>Flygplatser just nu</h2></header>${airportGrid()}</section>
  <section class="block"><header><h2>Senaste förfrågningar</h2>
    ${S.data.requests.length ? `<div class="hd-actions"><button class="btn alt sm" data-action="admin-clear-req" data-scope="finished">Ta bort avslutade</button><button class="btn stop sm" data-action="admin-clear-req" data-scope="all">Ta bort alla</button></div>` : ""}</header>
    ${S.data.requests.length ? `<div class="strips">${S.data.requests.slice(0, 40).map((r) => strip(r, { showPilot: true, actions: adminReqActions(r) })).join("")}</div>` : empty("Inga förfrågningar än.")}</section>
  ${adminAcars()}`;
}

/* ---------- Händelser ---------- */
document.addEventListener("input", (e) => {
  const b = e.target.dataset && e.target.dataset.bind;
  if (b && e.target.type !== "radio") setPath(ui, b, e.target.value);
});
document.addEventListener("change", (e) => {
  const t = e.target, b = t.dataset && t.dataset.bind;
  if (!b) return;
  setPath(ui, b, t.value);
  if (b === "pilot.airport") { ui.pilot.runway = ""; render(); }
  else if (b === "atcAirport" || b === "reg.role" || b === "adminAirport" || b === "activityFilter") render();
});

async function call(path, body, okMsg) {
  await api(path, { method: "POST", body });
  if (okMsg) toast(okMsg, "ok");
  await refresh(true);
}

document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target.dataset && e.target.dataset.form;
  if (!f) return;
  const btn = e.target.querySelector('button[type="submit"]');
  if (btn) btn.disabled = true;
  try {
    if (f === "login") {
      const r = await api("login", { method: "POST", body: { username: ui.login.username.trim(), password: ui.login.password } });
      S.token = r.token; S.me = r.user; ui.login.password = ""; ui.regDone = false; ui.profileInit = false;
      try { localStorage.setItem("edu_token", r.token); } catch (x) {}
      await refresh(true);
      startPolling();
      toast("Välkommen, " + r.user.username + "!", "ok");
    } else if (f === "register") {
      if (ui.reg.password !== ui.reg.password2) throw new Error("Lösenorden är inte likadana.");
      await api("register", { method: "POST", body: { username: ui.reg.username.trim(), password: ui.reg.password, role: ui.reg.role } });
      ui.login.username = ui.reg.username.trim();
      ui.reg = { username: "", password: "", password2: "", role: "pilot" };
      ui.regDone = true; ui.tab = "login"; render();
    } else if (f === "profile") {
      await call("profile", { flightNumber: ui.profile.flightNumber, airline: ui.profile.airline, destination: ui.profile.destination }, "Flyget är sparat.");
      ui.profileInit = false; await refresh(true);
    } else if (f === "request") {
      await call("requests", { airport: ui.pilot.airport, runway: ui.pilot.runway, type: ui.pilot.type }, "Förfrågan skickad.");
    } else if (f === "duty") {
      await call("profile", { airport: ui.atcAirport }, "Du är på tjänst.");
    } else if (f === "acars") {
      if (ui.acars.to === "@all" && !confirm("Skicka det här till alla piloter i hela systemet?")) return;
      await api("messages", { method: "POST", body: { airport: ui.acars.airport, to: ui.acars.to, text: ui.acars.text } });
      ui.acars.text = "";
      toast("ACARS skickat.", "ok");
      await refresh(true);
    } else if (f === "announce") {
      await api("announcements", { method: "POST", body: { audience: ui.ann.audience, text: ui.ann.text } });
      ui.ann.text = "";
      toast("Informationen är utlagd.", "ok");
      await refresh(true);
    } else if (f === "enroute") {
      await api("enroute", { method: "POST", body: { active: true, etaMinutes: ui.enroute.eta } });
      ui.enroute.eta = "";
      toast("Du är anmäld som på väg.", "ok");
      await refresh(true);
    } else if (f === "notice") {
      await api("airports/" + encodeURIComponent(e.target.dataset.ap) + "/notice-add", { method: "POST", body: { text: ui.status.notice } });
      ui.status.notice = "";
      toast("Informationen är utlagd.", "ok");
      await refresh(true);
    }
  } catch (err) {
    toast(err.message, "err");
  } finally {
    if (btn && btn.isConnected) btn.disabled = false;
  }
});

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  try {
    if (a === "tab") { ui.tab = el.dataset.v; render(); }
    else if (a === "logout") {
      try { await api("logout", { method: "POST" }); } catch (x) {}
      forceLogout();
    }
    else if (a === "pick-runway") { ui.pilot.runway = el.dataset.v; render(); }
    else if (a === "pick-type") { ui.pilot.type = el.dataset.v; render(); }
    else if (a === "cancel") {
      el.disabled = true;
      await call("requests/" + encodeURIComponent(el.dataset.id) + "/cancel", {}, "Förfrågan avslutad.");
    }
    else if (a === "decide") {
      el.disabled = true;
      const id = el.dataset.id, act = el.dataset.act;
      await call("requests/" + encodeURIComponent(id) + "/decide", { action: act, note: ui.notes[id] || "" },
        { approve: "Godkänd.", deny: "Nekad.", complete: "Banan är fri." }[act]);
      delete ui.notes[id];
    }
    else if (a === "activity-toggle") {
      ui.activityOpen = !ui.activityOpen;
      if (ui.activityOpen) {
        render();
        await refresh(true);
        const n = $("#activity");
        if (n && n.scrollIntoView) n.scrollIntoView({ block: "start" });
      } else {
        S.activity = null;
        render();
      }
    }
    else if (a === "ann-del") {
      el.disabled = true;
      await call("announcements/" + encodeURIComponent(el.dataset.id) + "/delete", {}, "Informationen är borttagen.");
    }
    else if (a === "enroute-off") {
      el.disabled = true;
      await call("enroute", { active: false }, "Flygningen är avslutad.");
    }
    else if (a === "acars-tpl") {
      ui.acars.text = el.dataset.v; render();
      const n = $("#at"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }
    else if (a === "acars-reply") {
      ui.acars.to = el.dataset.to; render();
      const n = $("#at"); if (n) { n.focus(); n.scrollIntoView({ block: "center" }); }
    }
    else if (a === "admin-del-req") {
      if (!confirm("Ta bort förfrågan? Om den har ett pågående tillstånd blir banan ledig.")) return;
      el.disabled = true;
      await call("admin/requests/" + encodeURIComponent(el.dataset.id) + "/delete", {}, "Förfrågan är borttagen.");
    }
    else if (a === "admin-clear-req") {
      const all = el.dataset.scope === "all";
      if (!confirm(all ? "Ta bort ALLA förfrågningar, även pågående tillstånd?" : "Ta bort alla avslutade förfrågningar?")) return;
      el.disabled = true;
      await call("admin/requests/clear", { scope: el.dataset.scope }, "Förfrågningarna är borttagna.");
    }
    else if (a === "admin-del-msg") {
      el.disabled = true;
      await call("admin/messages/" + encodeURIComponent(el.dataset.id) + "/delete", {}, "Meddelandet är borttaget.");
    }
    else if (a === "admin-clear-msg") {
      if (!confirm("Ta bort alla ACARS-meddelanden?")) return;
      el.disabled = true;
      await call("admin/messages/clear", {}, "Alla ACARS-meddelanden är borttagna.");
    }
    else if (a === "ap-close" || a === "ap-open") {
      el.disabled = true;
      const closing = a === "ap-close";
      await call("airports/" + encodeURIComponent(el.dataset.ap) + "/" + (closing ? "close" : "open"), closing ? { reason: ui.status.reason } : {},
        closing ? "Flygplatsen är stängd." : "Flygplatsen är öppen.");
      if (closing) ui.status.reason = "";
      render();
    }
    else if (a === "rwy-toggle") {
      el.disabled = true;
      const closing = el.dataset.closed === "0", rw = el.dataset.rw;
      await call("airports/" + encodeURIComponent(el.dataset.ap) + "/runway", { runway: rw, closed: closing, reason: ui.status.reason },
        closing ? "Bana " + rw + " är stängd." : "Bana " + rw + " är öppen.");
      if (closing) ui.status.reason = "";
      render();
    }
    else if (a === "notice-tpl") {
      ui.status.notice = el.dataset.v; render();
      const n = $("#sn"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }
    else if (a === "notice-remove") {
      el.disabled = true;
      await call("airports/" + encodeURIComponent(el.dataset.ap) + "/notice-remove", { id: el.dataset.id }, "Informationen är borttagen.");
    }
    else if (a === "duty-off") { await call("profile", { airport: null }, "Du är av tjänst."); ui.atcAirport = ""; render(); }
    else if (a === "user-act") {
      const name = el.dataset.name, act = el.dataset.act;
      let body = {};
      if (act === "delete" && !confirm("Ta bort kontot " + name + "? Det går inte att ångra.")) return;
      if (act === "password") {
        const pw = prompt("Nytt lösenord för " + name + " (minst 6 tecken):");
        if (!pw) return;
        body = { password: pw };
      }
      el.disabled = true;
      await call("admin/users/" + encodeURIComponent(name) + "/" + act, body,
        { approve: "Kontot är godkänt.", reject: "Kontot är nekat.", delete: "Kontot är borttaget.", password: "Lösenordet är bytt." }[act]);
    }
  } catch (err) {
    toast(err.message, "err");
    if (el.isConnected) el.disabled = false;
    refresh(true);
  }
});

/* ---------- Start ---------- */
if (S.token) { refresh(true).then(() => { if (S.me) startPolling(); else render(); }); }
else { S.booting = false; render(); }
</script>
</body>
</html>
